name: DeepSeekR1-Distill-Qwen-1.5B
id: deepseekr1_quantized
status: public
headline: State-of-the-art large language model useful on a variety of language
  understanding and generation tasks.
domain: Generative AI
description: We introduce our first-generation reasoning models,
  DeepSeek-R1-Zero and DeepSeek-R1. DeepSeek-R1-Zero, a model trained via
  large-scale reinforcement learning (RL) without supervised fine-tuning (SFT)
  as a preliminary step, demonstrated remarkable performance on reasoning. With
  RL, DeepSeek-R1-Zero naturally emerged with numerous powerful and interesting
  reasoning behaviors. However, DeepSeek-R1-Zero encounters challenges such as
  endless repetition, poor readability, and language mixing. To address these
  issues and further enhance reasoning performance, we introduce DeepSeek-R1,
  which incorporates cold-start data before RL. DeepSeek-R1 achieves
  performance comparable to OpenAI-o1 across math, code, and reasoning tasks.
  To support the research community, we have open-sourced DeepSeek-R1-Zero,
  DeepSeek-R1, and six dense models distilled from DeepSeek-R1 based on Llama
  and Qwen. DeepSeek-R1-Distill-Qwen-32B outperforms OpenAI-o1-mini across
  various benchmarks, achieving new state-of-the-art results for dense models.
use_case: Text Generation
tags:
  - llm
  - generative-ai
  - quantized
research_paper: https://github.com/deepseek-ai/DeepSeek-R1/blob/main/DeepSeek_R1.pdf
research_paper_title: "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via R0einforcement Learning"
license: https://github.com/deepseek-ai/DeepSeek-R1/blob/main/LICENSE
source_repo: https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
technical_details:
  Input sequence length for Prompt Processor: 128
  Context length: 4096
  Number of parameters: 1.5B
  Model size: 2.4G
  Precision: w4a16 + w8a16 (few layers)
  Num of key-value heads: 2
  Model-1 (Prompt Processor): DeepSeekR1-PromptProcessor-Quantized
  Prompt processor input: 128 tokens + position embeddings + attention mask + KV cache inputs
  Prompt processor output: 128 output tokens + KV cache outputs
  Model-2 (Token Generator): DeepSeekR1-TokenGenerator-Quantized
  Token generator input: 1 input token + position embeddings + attention mask + KV cache inputs
  Token generator output: 1 output token + KV cache outputs
  Use: Initiate conversation with prompt-processor and then token generator for subsequent iterations.
  Minimum QNN SDK version required: 2.27.7
  Supported languages: English.
  TTFT: Time To First Token is the time it takes to generate the first response
    token. This is expressed as a range because it varies based on the length
    of the prompt. The lower bound is for a short prompt (up to 128 tokens,
    i.e., one iteration of the prompt processor) and the upper bound is for a
    prompt using the full context length (4096 tokens).
  Response Rate: Rate of response generation after the first response token.
